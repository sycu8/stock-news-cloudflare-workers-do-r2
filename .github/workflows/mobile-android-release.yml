# Build signed Android AAB when keystore secrets are configured.
# Secrets (repo Settings → Secrets):
#   ANDROID_KEYSTORE_BASE64  — base64 of stocknews-release.keystore
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS        — stocknews
#   ANDROID_KEY_PASSWORD     — same as store if PKCS12
name: mobile-android-release

on:
  workflow_dispatch:
  push:
    branches: [cursor/mobile-apps-dc08, main]
    paths: [mobile/**]

jobs:
  bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install deps
        run: npm ci
      - name: Restore keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > stocknews-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../../stocknews-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
      - name: Capacitor sync
        run: npx cap sync android
      - name: Build release AAB
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: cd android && ./gradlew bundleRelease
      - name: Upload AAB artifact
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
      - name: Skip notice
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "Add ANDROID_KEYSTORE_* secrets to build signed AAB in CI"
