# Install the mobile app and sync native projects on pull requests.
# The signed Android release job (mobile-android-release.yml) is separate:
# it uses android-actions/setup-android and is known to fail on feature branches.

name: Mobile CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Capacitor version tests
        run: npm test
      - name: Sync native projects
        run: npx cap sync
